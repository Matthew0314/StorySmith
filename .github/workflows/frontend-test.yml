name: Frontend Build

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main


jobs:

  frontend-build:

    runs-on: ubuntu-latest


    steps:

      - name: Checkout code
        uses: actions/checkout@v4


      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json


      - name: Install dependencies
        working-directory: frontend
        run: npm install


      - name: Build frontend
        working-directory: frontend
        run: npm run build