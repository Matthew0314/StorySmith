apiVersion: apps/v1
kind: Deployment

metadata:
  name: backend

spec:
  replicas: 2

  selector:
    matchLabels:
      app: backend

  template:
    metadata:
      labels:
        app: backend

    spec:
      containers:
      - name: backend
        image: storysmith-backend:latest
        ports:
        - containerPort: 8080
        env:

        - name: DB_URL
          valueFrom:
            secretKeyRef:
              name: storysmith-secret
              key: POSTGRES_URL


        - name: DB_USERNAME
          valueFrom:
            secretKeyRef:
              name: storysmith-secret
              key: POSTGRES_USER


        - name: DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: storysmith-secret
              key: POSTGRES_PASSWORD


        - name: GEMINI_API_KEY
          valueFrom:
            secretKeyRef:
              name: storysmith-secret
              key: GEMINI_API_KEY